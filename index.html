  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #1a0000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .banner {
      width: 100%;
      display: block;
    }

    .btn-wrap {
      padding: 0 20px 32px;
      background: #1a0000;
    }

    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #e85d2a, #c93a10);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      padding: 18px 20px;
      border-radius: 14px;
      box-shadow: 0 6px 28px rgba(232,93,42,.5);
      transition: transform .15s, box-shadow .15s;
      letter-spacing: .3px;
    }

    .btn:active {
      transform: scale(.97);
      box-shadow: 0 3px 14px rgba(232,93,42,.4);
    }

    .btn span {
      display: block;
      font-size: .85rem;
      font-weight: 500;
      opacity: .85;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="page">
